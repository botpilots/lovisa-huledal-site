media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]

components:
  socialMedia:
    type: object
    fields:
      - name: facebook
        label: Facebook
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: youtube
        label: YouTube
        type: string

content:
  # HOME
  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: title
        type: string

      - name: biography
        label: Biography (Swedish)
        type: rich-text

      - name: biographyEn
        label: Biography (English)
        type: rich-text

      - name: aboutMosaic
        label: About mosaic
        description: Four images in order — large left, top right, bottom right, wide bottom.
        type: object
        list:
          min: 4
          max: 4
          collapsible:
            collapsed: true
            summary: "Image {index}"
        fields:
          - name: image
            label: Image
            type: image

          - name: offsetX
            label: Horizontal focus (%) (left = 0, right = 100)
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical focus (%) (higher = lower)
            type: number
            options:
              min: 0
              max: 100

          - name: alt
            label: Alt text
            type: string

  # REPERTOIRE
  - name: repertoire
    label: Repertoire
    type: file
    path: content/repertoire.json
    format: json
    operations:
      delete: false
    fields:
      - name: entries
        label: Repertoire
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{composer} - {piece}"
        fields:
          - name: type
            label: Type of Music
            type: select
            options:
              values:
                - Opera
                - Chamber
                - Sacral

          - name: composer
            type: string

          - name: piece
            type: string

          - name: role
            label: Role
            type: string

  # PROGRAMMES
  - name: programmes
    label: Programmes
    type: collection
    path: content/programmes
    format: json
    filename: "{title}.json"
    view:
      primary: title
    fields:
      - name: title
        type: string

      - name: headerColor
        label: Header colour
        description: Optional. Background for the title band (or full media area when there is no image). Leave empty to use the next sand tone from the site theme — each programme gets a different colour until the palette cycles.
        type: color

      - name: description
        type: rich-text

      - name: images
        label: Images
        description: Order in the list is the default sequence. Visitors can step through with arrows on the programme image.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Image {index}"
        fields:
          - name: image
            label: Image
            type: image

          - name: offsetX
            label: Horizontal focus (%) (left = 0, right = 100)
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical focus (%) (higher = lower)
            type: number
            options:
              min: 0
              max: 100

      - name: repertoire
        label: Repertoire
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{composer} - {piece}"
        fields:
          - name: composer
            type: string

          - name: piece
            type: string

  # EVENTS
  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename: "{date}-{name}.json"
    view:
      primary: name
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: id
        label: Event ID
        description: Optional. Used for schedule links (e.g. #schedule-event-my-id). If empty, the filename is used (e.g. 2026-07-30-la-liberazione).
        type: string

      - name: date
        type: date

      - name: time
        label: Time of Day
        type: string

      - name: name
        label: Event / performance name
        description: Optional. If empty, the linked programme title is shown. If set, the programme title appears in parentheses after the name on the website.
        type: string
        required: false

      - name: location
        label: Location
        description: Venue or place, e.g. Båstad Kyrka, Confidencen.
        type: string

      - name: description
        type: rich-text

      - name: link
        type: string

      - name: programme
        label: Programme
        type: reference
        options:
          collection: programmes

  # MEDIA GROUP
  - name: mediaSection
    label: Media
    type: group
    items:

      - name: videos
        label: Videos
        type: collection
        path: content/videos
        format: json
        filename: "{title}.json"
        view:
          primary: title
        fields:
          - name: youtubeLink
            label: YouTube Link
            type: string

          - name: title
            type: string

          - name: description
            type: text

      - name: photos
        label: Photos
        type: file
        path: content/photos.json
        format: json
        operations:
          delete: false
        fields:
          - name: portraits
            label: Portraits
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                type: image

              - name: caption
                type: string

          - name: onStage
            label: On Stage
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                type: image

              - name: caption
                type: string

  # CONTACT
  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    operations:
      delete: false
    fields:
      - name: agency
        label: Agency
        type: object
        fields:
          - name: name
            type: string

          - name: email
            type: string

          - name: phone
            type: string

      - name: lovisa
        label: Lovisa
        type: object
        fields:
          - name: name
            type: string

          - name: email
            type: string

          - name: phone
            type: string

      - name: socialMedia
        label: Social Media
        component: socialMedia

actions:
  - name: deploy-site
    label: Deploy Site
    workflow: pages-cms-action.yml